# Runs on pull requests and by hand (Actions -> ci -> Run workflow), not on every push: the whole suite in one command takes
# over 10 minutes on a loaded machine and has never been run on GitHub's runners yet (docs/PIPELINES-REVIEW.md, F1).
# Proposed next step: one job per folder of src/ (that is how it was made reliable locally), then trigger on push again.
name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm security
      - run: pnpm build
